name: build-release

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RPEReader.sln

      - name: Build
        run: dotnet build RPEReader.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/RPEReader.Core.Tests/RPEReader.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  publish:
    name: Publish win-x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained win-x64
        shell: pwsh
        run: ./build/publish.ps1 -OutputPath ${{ github.workspace }}/Release

      - name: Show output summary
        shell: pwsh
        run: |
          $exe = Get-Item "${{ github.workspace }}/Release/RPEReader.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $files = (Get-ChildItem "${{ github.workspace }}/Release" -Recurse -File).Count
          $mb = [math]::Round(((Get-ChildItem "${{ github.workspace }}/Release" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          "### RPE Reader publish output"          | Out-File -Append $env:GITHUB_STEP_SUMMARY
          ""                                        | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Property | Value |"                    | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "|---|---|"                               | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Executable | ``RPEReader.exe`` |"      | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Version | $($exe.VersionInfo.FileVersion) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| SHA-256 | ``$hash`` |"                 | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Files | $files |"                      | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "| Size | $mb MB |"                       | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload Release folder
        uses: actions/upload-artifact@v4
        with:
          name: RPEReader-win-x64
          path: ${{ github.workspace }}/Release/
          retention-days: 30
